name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      # 單檔版要能從同一份原始碼建置出來
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_artifact.py
