<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1c1620">
  <title>五年三班大隊接力</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=dev">
</head>
<body>
  <main class="stage" id="stage">
    <!-- 手機和直拿的平板：兩頁疊成一欄；橫拿的平板和電腦：攤開成左右兩頁 -->
    <div class="page page-left">
    <header class="hud off" id="hud">
      <div class="courage">
        <span class="courage-label">心靈能量</span>
        <span class="courage-bar" id="courageBar" role="meter" aria-label="心靈能量" aria-valuemin="0" aria-valuemax="100" aria-valuenow="60"><span class="courage-fill" id="courageFill"></span></span>
        <span class="mood-delta" id="courageDelta"></span>
      </div>
      <span class="chip" id="dayChip"></span>
      <button class="pause-btn" type="button" id="btnPause" aria-label="暫停">❚❚ 暫停</button>
    </header>

    <div class="scene">
      <canvas id="screen" width="1536" height="864" role="img" aria-label="遊戲畫面"></canvas>
    </div>
    <p class="scene-caption" id="sceneCaption" aria-hidden="true"></p>
    </div>

    <p class="sr-only" id="srLine" aria-live="polite"></p>
    <div class="page page-right">
    <section class="dialog idle" id="dialog">
      <div class="dialog-head">
        <canvas class="portrait" id="portrait" width="96" height="96" aria-hidden="true"></canvas>
        <div class="speaker" id="speaker"></div>
      </div>
      <div class="line" id="line"></div>
      <div class="inner" id="inner" hidden></div>
      <button class="back-btn" type="button" id="btnBack" aria-label="看上一句台詞" hidden>↶ 上一句</button>
      <div class="next-hint" id="nextHint">點一下繼續 ▼</div>
    </section>

    <div class="panel" id="panel" hidden></div>
    </div>
    <div class="panel pause-layer" id="pause" hidden></div>
  </main>

  <script type="module" src="js/game.js?v=dev"></script>
</body>
</html>
